name: Release → Telegram
run-name: >-
  Release ${{ inputs.version != '' && inputs.version || inputs.bump || github.ref_name }}

# Builds ALL FOUR platforms (Android / Windows / Linux / macOS) when you cut a
# version, and hands them off. It NEVER touches GitHub Releases at all — you cut
# the release yourself, by hand. It runs only:
#   * on a version tag, e.g.  git tag v1.0.1 && git push origin v1.0.1
#   * or manually — Actions tab → this workflow → Run workflow
# (No per-push builds: day-to-day master pushes do nothing here.)
#
# Delivery:
#   * Android APKs (per-ABI, each < 50 MB) are sent straight to Telegram.
#   * All four platforms are uploaded as Actions run artifacts. Desktop
#     installers exceed Telegram's 50 MB bot limit, so the run is where you grab
#     them; a Telegram message links the run.
#   * Nothing is ever written to the Releases tab — that stays 100% manual.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOTENV              contents of the app's .env (it is a pubspec asset — the
#                       build FAILS without it)
#   TELEGRAM_BOT_TOKEN  @taskNotifierrbot token from @BotFather
#   TELEGRAM_CHAT_IDS   comma-separated NUMERIC chat ids, e.g. "123456789".
#                       The Bot API cannot message a person by @username; each
#                       recipient must press Start on the bot once. Get your id
#                       from @userinfobot.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise'
        type: choice
        default: patch
        options:
          - patch          # 3.0.2 -> 3.0.3
          - minor          # 3.0.2 -> 3.1.0
          - major          # 3.0.2 -> 4.0.0
          - build-only     # name unchanged, build number +1
          - none           # build and ship whatever is committed
      version:
        description: 'Exact version name, e.g. 3.1.0 (overrides the choice above)'
        type: string
        required: false
      notes:
        description: 'Release notes for the Telegram message'
        type: string
        required: false
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runners ship CMake 4.x, which hard-errors on dependencies that still
  # declare cmake_minimum_required(VERSION < 3.5) (e.g. firebase_cpp_sdk).
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  # ---------------------------------------------------------------- Version ----
  # Decides what this release IS, and is the only job allowed to change it.
  #
  # Every build job checks out the commit this one produces, so all four
  # platforms ship the same version — resolving it per job would let a push
  # landing mid-run give Android one version and Windows another.
  #
  # The build number always rises, whatever the name does. It is what Android
  # compares for "is there an update", and what the backend's AppVersion row
  # stores; two releases sharing one build number are invisible to the updater.
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      build: ${{ steps.resolve.outputs.build }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag push below needs real history, not a shallow clone.
          fetch-depth: 0
          # The default GITHUB_TOKEN is not an admin, so the version bump is
          # rejected by the branch protection on the default branch. A
          # RELEASE_PAT that belongs to somebody who can push is what gets it in.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Resolve version
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          CURRENT="$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')"
          case "${CURRENT}" in
            *+*) ;;
            *) echo "::error title=Malformed version::pubspec.yaml has 'version: ${CURRENT}' with no +buildNumber. Android needs one."; exit 1 ;;
          esac

          echo "::notice title=Current version::${CURRENT}"

          NAME="${CURRENT%%+*}"
          BUILD="${CURRENT##*+}"
          case "${BUILD}" in
            ''|*[!0-9]*) echo "::error title=Malformed build number::'${BUILD}' is not an integer."; exit 1 ;;
          esac

          # A tag push ships exactly what is committed. Rewriting the version on
          # a tag would make the tag name and the built artifact disagree.
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "Tag build — using the committed version verbatim."
            NEW_NAME="${NAME}"
            NEW_BUILD="${BUILD}"
            BUMPED=no
          else
            IFS=. read -r MA MI PA <<< "${NAME}"
            MA="${MA:-0}"; MI="${MI:-0}"; PA="${PA:-0}"
            NEW_BUILD="$((BUILD + 1))"

            if [ -n "${EXPLICIT}" ]; then
              case "${EXPLICIT}" in
                *[!0-9.]*) echo "::error title=Bad version::'${EXPLICIT}' must be digits and dots only, e.g. 3.1.0"; exit 1 ;;
              esac
              NEW_NAME="${EXPLICIT}"
              BUMPED=yes
            else
              case "${BUMP}" in
                patch)      NEW_NAME="${MA}.${MI}.$((PA + 1))"; BUMPED=yes ;;
                minor)      NEW_NAME="${MA}.$((MI + 1)).0";     BUMPED=yes ;;
                major)      NEW_NAME="$((MA + 1)).0.0";         BUMPED=yes ;;
                build-only) NEW_NAME="${NAME}";                 BUMPED=yes ;;
                none)       NEW_NAME="${NAME}"; NEW_BUILD="${BUILD}"; BUMPED=no ;;
                *)          echo "::error title=Unknown bump::'${BUMP}'"; exit 1 ;;
              esac
            fi
          fi

          echo "name=${NEW_NAME}"   >> "$GITHUB_OUTPUT"
          echo "build=${NEW_BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_NAME}"   >> "$GITHUB_OUTPUT"
          echo "bumped=${BUMPED}"   >> "$GITHUB_OUTPUT"
          {
            echo "### Release version"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| was | \`${CURRENT}\` |"
            echo "| now | \`${NEW_NAME}+${NEW_BUILD}\` |"
            echo "| tag | \`v${NEW_NAME}\` |"
            echo ""
            echo "Latest released version is now **${NEW_NAME}+${NEW_BUILD}**."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Releasing::${NEW_NAME}+${NEW_BUILD} (tag v${NEW_NAME})"

      - name: Commit and tag
        id: commit
        if: steps.resolve.outputs.bumped == 'yes'
        env:
          NAME: ${{ steps.resolve.outputs.name }}
          BUILD: ${{ steps.resolve.outputs.build }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          # Refuse to reuse a tag rather than silently shipping a second, different
          # build under a name someone has already installed.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || \
             git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "::error title=Tag exists::${TAG} is already published. Pick a different bump, or delete the tag first."
            exit 1
          fi

          # python3, not sed -i: BSD and GNU sed disagree on -i, and the BSD
          # form silently leaves the file untouched. `git commit` would then
          # fail with "nothing to commit" — an error, but one whose message
          # points nowhere near the cause.
          #
          # Anchored to the line start and capped at one substitution, so a
          # dependency's own `version:` key is never touched.
          python3 - "${NAME}+${BUILD}" <<'PY'
          import re, sys
          new = sys.argv[1]
          src = open('pubspec.yaml', encoding='utf-8').read()
          out, n = re.subn(r'(?m)^version:.*$', f'version: {new}', src, count=1)
          if n != 1:
              sys.exit('pubspec.yaml has no top-level version: line')
          open('pubspec.yaml', 'w', encoding='utf-8').write(out)
          PY
          grep -E '^version:' pubspec.yaml

          git config user.name  "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -am "chore: ${NAME}+${BUILD}"
          git tag "${TAG}"

          # Pushed with GITHUB_TOKEN, which deliberately does NOT re-trigger
          # workflows. Without that guarantee this tag would start a second run
          # of this same workflow and ship the release twice.
          #
          # A RELEASE_PAT does re-trigger, so the tag is pushed only after the
          # branch push succeeds — a tag with no bump behind it is worse than
          # no tag.
          # A rejected push must not cancel the release.
          #
          # The default branch is protected and GITHUB_TOKEN is not an admin, so
          # without a RELEASE_PAT this push is refused — and refusing to build
          # because a bookkeeping commit could not land is the wrong trade. The
          # version is already resolved, and the build jobs stamp it in
          # themselves, so the artifacts ship as exactly what this run says.
          # What is lost is the record in git: worth a loud warning, not a stop.
          if git push origin HEAD:"${GITHUB_REF_NAME}"; then
            git push origin "${TAG}" || echo "::warning title=Tag not pushed::${TAG} could not be pushed."
            echo "pushed=yes" >> "$GITHUB_OUTPUT"
          else
            git tag -d "${TAG}" || true
            echo "pushed=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=Version bump not committed::The default branch is protected and this run is not an admin, so ${NAME}+${BUILD} was NOT written back to git — this build still ships as ${NAME}+${BUILD}, but the repo still says the old one. Add a RELEASE_PAT secret (fine-grained PAT, Contents: read and write) to close the gap."
            {
              echo "### ⚠️ Version bump was not committed"
              echo ""
              echo "These builds ship as **${NAME}+${BUILD}**, but the repository still records the previous version."
              echo "Add a \`RELEASE_PAT\` secret (fine-grained PAT with **Contents: read and write**) so the bump can land."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The build jobs must check out a commit the remote actually has.
      #
      # When the bump could not be pushed, the commit exists only on this
      # runner — checking it out fails with "reference is not a tree", which is
      # a far more confusing failure than the rejected push it came from.
      - name: Record the commit every build job will use
        id: sha
        run: |
          set -euo pipefail
          if [ "${{ steps.commit.outputs.pushed }}" = "yes" ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- Android ----
  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        # The commit the version job just made. Resolving the ref per job would
        # let a push landing mid-run give Android one version and Windows another.
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Applied here rather than trusted from the checkout. When the bump could
      # not be committed, the checked-out tree still carries the OLD version —
      # and an APK whose versionCode disagrees with the release it was cut as is
      # invisible to the in-app updater. Idempotent: a no-op when the commit did
      # land.
      - name: Stamp the resolved version into the build
        shell: bash
        env:
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          python3 - "$NAME+$BUILD" <<'PY'
          import re, sys
          new = sys.argv[1]
          src = open('pubspec.yaml', encoding='utf-8').read()
          out, n = re.subn(r'(?m)^version:.*$', f'version: {new}', src, count=1)
          if n != 1:
              sys.exit('pubspec.yaml has no top-level version: line')
          open('pubspec.yaml', 'w', encoding='utf-8').write(out)
          PY
          grep -E '^version:' pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create .env (declared as a pubspec asset — the build fails without it)
        run: printf '%s' "${{ secrets.DOTENV }}" > .env
      # Restore the release signing key. android/app/key.properties is
      # gitignored, so without this the build falls through to
      # signingConfigs.getByName("debug") — and a CI runner generates a FRESH
      # debug keystore per run. Every delivered APK then carried a different
      # signature, so users hit "package conflicts with an existing package"
      # and could never update; they had to uninstall first. The secrets hold
      # the real upload keystore, whose SHA-256 matches what is already
      # installed on devices, so updates now apply in place.
      - name: Restore Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ] || [ -z "${KEY_PROPERTIES}" ]; then
            echo "::error title=Signing secrets missing::ANDROID_KEYSTORE_B64 / ANDROID_KEY_PROPERTIES are not set. Refusing to ship a debug-signed APK that users cannot update to."
            exit 1
          fi
          printf '%s' "${KEYSTORE_B64}" | base64 -d > android/app/upload-keystore.jks
          printf '%s' "${KEY_PROPERTIES}" > android/app/key.properties
          echo "keystore restored ($(stat -c%s android/app/upload-keystore.jks) bytes)"
      - run: flutter --version
      - run: flutter pub get
      # Split per ABI: release keeps R8/minify disabled (extensions break under
      # it), so a universal APK would be large. Per-ABI keeps each under the
      # 50 MB Telegram Bot API document limit.
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi
      # Fail loudly rather than shipping an APK nobody can update to. A
      # debug-signed build is the exact failure this pipeline had before, and it
      # is invisible until a user tries to install over an existing copy.
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort | tail -1)"
          APK="$(ls build/app/outputs/flutter-apk/app-*-release.apk | head -1)"
          CERT="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERT" | grep -E 'certificate DN|SHA-256 digest'
          if echo "$CERT" | grep -q 'CN=Android Debug'; then
            echo "::error title=Debug-signed APK::Built with the debug keystore. Users could not update to this build."
            exit 1
          fi
      # Prints the versionCode/versionName baked into every APK, and fails if the
      # ABIs disagree.
      #
      # Flutter's --split-per-abi rewrites versionCode per ABI as
      # `abi * 1000 + versionCode` (arm32=1, arm64=2, x86_64=4). That is for the
      # Play Store; here it silently broke the in-app updater, because the
      # backend stores ONE number to compare against. android/app/build.gradle.kts
      # overrides it back — this step is what proves the override still works
      # after a Flutter upgrade, instead of us finding out from users.
      - name: Report and verify versionCode
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 | sort | tail -1)"
          CODES=""
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            LINE="$("$AAPT" dump badging "$APK" | head -1)"
            CODE="$(echo "$LINE" | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+')"
            NAME="$(echo "$LINE" | grep -oE "versionName='[^']*'" | cut -d"'" -f2)"
            echo "$(basename "$APK"): versionCode=$CODE versionName=$NAME"
            echo "- \`$(basename "$APK")\` → versionCode **$CODE**, versionName **$NAME**" >> "$GITHUB_STEP_SUMMARY"
            CODES="$CODES $CODE"
          done
          UNIQUE="$(echo $CODES | tr ' ' '\n' | sort -u | wc -l)"
          if [ "$UNIQUE" -ne 1 ]; then
            echo "::error title=versionCode mismatch::APKs disagree on versionCode ($CODES). The per-ABI offset override in android/app/build.gradle.kts is not applying — the in-app updater will loop for some users."
            exit 1
          fi
          echo "::notice title=versionCode::$(echo $CODES | cut -d' ' -f1) (identical across all ABIs)"
      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: sozo-android
          path: dist/*.apk
          if-no-files-found: error

      # Android TV sideload set. This is NOT a separate build and there is no
      # Gradle flavour: the single APK now declares LEANBACK_LAUNCHER and
      # touchscreen-optional, so the same binary IS the TV binary. This artifact
      # only isolates the two ABIs Android TV devices actually ship — arm64-v8a
      # (Shield / Chromecast with Google TV / Google TV Streamer / most smart
      # TVs) and armeabi-v7a (older, cheaper boxes) — so there is one obvious
      # file to sideload instead of three.
      #
      # Filenames are deliberately left UNRENAMED. Copying an APK to
      # "app-tv-release.apk" would assert a build that does not exist, and the
      # first diff of the two files would be indistinguishable from a bug.
      #
      # Runs AFTER the upload above on purpose: if an ABI ever disappears from
      # Flutter's output, sozo-android is already safely uploaded.
      - name: Collect Android TV sideload set (same APKs, TV-capable ABIs)
        run: |
          set -euo pipefail
          mkdir -p dist-tv
          for abi in arm64-v8a armeabi-v7a; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "${src}" ]; then
              cp "${src}" dist-tv/
            else
              echo "::warning title=TV ABI missing::${src} was not produced by --split-per-abi"
            fi
          done
          ls -lh dist-tv
      - uses: actions/upload-artifact@v4
        with:
          name: sozo-androidtv
          path: dist-tv/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows ----
  windows:
    needs: version
    runs-on: windows-latest
    env:
      # The runner's very new MSVC turns flutter_inappwebview_windows's use of the
      # deprecated <experimental/coroutine> header into a hard error (STL1011).
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Applied here rather than trusted from the checkout. When the bump could
      # not be committed, the checked-out tree still carries the OLD version —
      # and an APK whose versionCode disagrees with the release it was cut as is
      # invisible to the in-app updater. Idempotent: a no-op when the commit did
      # land.
      - name: Stamp the resolved version into the build
        shell: bash
        env:
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          python3 - "$NAME+$BUILD" <<'PY'
          import re, sys
          new = sys.argv[1]
          src = open('pubspec.yaml', encoding='utf-8').read()
          out, n = re.subn(r'(?m)^version:.*$', f'version: {new}', src, count=1)
          if n != 1:
              sys.exit('pubspec.yaml has no top-level version: line')
          open('pubspec.yaml', 'w', encoding='utf-8').write(out)
          PY
          grep -E '^version:' pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure NuGet (flutter_inappwebview_windows fetches WebView2 with it)
        uses: NuGet/setup-nuget@v2
      - name: Create .env (from secret, or empty placeholder)
        shell: bash
        run: printf '%s' "${{ secrets.DOTENV }}" > .env
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer\Sozo.iss"
      - name: Also zip the raw build (portable)
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "build\installer\Sozo-Windows-portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Sozo-Windows
          path: |
            build/installer/Sozo-Setup.exe
            build/installer/Sozo-Windows-portable.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux ----
  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Applied here rather than trusted from the checkout. When the bump could
      # not be committed, the checked-out tree still carries the OLD version —
      # and an APK whose versionCode disagrees with the release it was cut as is
      # invisible to the in-app updater. Idempotent: a no-op when the commit did
      # land.
      - name: Stamp the resolved version into the build
        shell: bash
        env:
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          python3 - "$NAME+$BUILD" <<'PY'
          import re, sys
          new = sys.argv[1]
          src = open('pubspec.yaml', encoding='utf-8').read()
          out, n = re.subn(r'(?m)^version:.*$', f'version: {new}', src, count=1)
          if n != 1:
              sys.exit('pubspec.yaml has no top-level version: line')
          open('pubspec.yaml', 'w', encoding='utf-8').write(out)
          PY
          grep -E '^version:' pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop + plugin system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv \
            libsecret-1-dev libjsoncpp-dev libsecret-1-0
      - name: Create .env (from secret, or empty placeholder)
        run: printf '%s' "${{ secrets.DOTENV }}" > .env
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package (tar.gz)
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/Sozo-Linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: Sozo-Linux
          path: Sozo-Linux-x64.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS ----
  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Applied here rather than trusted from the checkout. When the bump could
      # not be committed, the checked-out tree still carries the OLD version —
      # and an APK whose versionCode disagrees with the release it was cut as is
      # invisible to the in-app updater. Idempotent: a no-op when the commit did
      # land.
      - name: Stamp the resolved version into the build
        shell: bash
        env:
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          python3 - "$NAME+$BUILD" <<'PY'
          import re, sys
          new = sys.argv[1]
          src = open('pubspec.yaml', encoding='utf-8').read()
          out, n = re.subn(r'(?m)^version:.*$', f'version: {new}', src, count=1)
          if n != 1:
              sys.exit('pubspec.yaml has no top-level version: line')
          open('pubspec.yaml', 'w', encoding='utf-8').write(out)
          PY
          grep -E '^version:' pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create .env (from secret, or empty placeholder)
        run: printf '%s' "${{ secrets.DOTENV }}" > .env
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build macos --release
      # No paid Apple Developer cert, so this is NOT notarized. The goal here is
      # a VALID ad-hoc signature: with one, a downloaded app shows the soft
      # "unverified developer" prompt (right-click → Open works). An INVALID
      # signature is what triggers the hard "app is damaged" block on Apple
      # Silicon. `codesign --deep` alone is unreliable for the nested media_kit /
      # mpv dylibs, so we sign inside-out (every Mach-O first, frameworks, then
      # the app last) and then FAIL the build if the signature doesn't verify.
      - name: Ad-hoc codesign (inside-out, must verify)
        run: |
          set -euo pipefail
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -n1)
          ENT="$PWD/macos/Runner/Release.entitlements"
          echo "Signing: $APP"

          # 1) every nested dylib / .so (deepest code first)
          find "$APP" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 -I {} codesign --force --timestamp=none --sign - "{}"

          # 2) every embedded framework bundle
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' -print0 \
              | xargs -0 -I {} codesign --force --timestamp=none --sign - "{}"
          fi

          # 3) the app bundle last, with entitlements — --deep as a catch-all
          codesign --force --deep --timestamp=none \
            --entitlements "$ENT" --sign - "$APP"

          # Must be valid, else the recipient gets "damaged" — fail loudly.
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Create unsigned DMG (with open instructions)
        run: |
          set -euo pipefail
          brew install create-dmg
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -n1)

          # Staging dir so the DMG carries the app + a plain-text "how to open"
          # note (Gatekeeper still quarantines any un-notarized download).
          STAGE="$(mktemp -d)/Sozo"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          cat > "$STAGE/OCHISH — READ ME.txt" <<'TXT'
          Sozo — macOS'da ochish (Apple imzosi yo'q, bu normal):

          1. Sozo.app ni Applications ga sudrang.
          2. Terminal'ni oching va shu bitta buyruqni bajaring:

               xattr -dr com.apple.quarantine /Applications/Sozo.app

          3. Endi Sozo oddiy ochiladi (Launchpad yoki Applications'dan).

          Alternativa: Applications'da Sozo.app ni o'ng tugma → Open → Open.
          Bu bir marta kerak; keyin har doim oddiy ochiladi.
          TXT

          echo "Packaging DMG from $STAGE"
          create-dmg \
            --volname "Sozo" \
            --window-size 560 400 \
            --icon-size 110 \
            --app-drop-link 400 185 \
            --icon "$(basename "$APP")" 150 185 \
            --no-internet-enable \
            "Sozo-macOS.dmg" "$STAGE" || \
          create-dmg --volname "Sozo" "Sozo-macOS.dmg" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: Sozo-macOS
          path: Sozo-macOS.dmg
          if-no-files-found: error

  # ------------------------------------------------- Deliver (Telegram) --------
  deliver:
    needs: [version, android, windows, linux, macos]
    # Deliver whatever succeeded, even if one platform's build failed — but not
    # if the run was cancelled.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Not fatal: when every build failed there is nothing to download, and the
      # message saying so is exactly what this job now exists to send.
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist

      - name: Flatten
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out dist
          find dist -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.zip' \
            -o -name '*.tar.gz' -o -name '*.dmg' \) -exec cp {} out/ \;
          echo "Collected:"
          ls -lh out || true

      - name: Send to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_BUILD: ${{ needs.version.outputs.build }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -uo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_IDS}" ]; then
            echo "::warning title=Telegram skipped::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_IDS not set. Builds are attached to this run as artifacts."
            exit 0
          fi

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          MAX=$((49 * 1024 * 1024))   # Bot API sendDocument limit is 50 MB
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Nothing built at all. Say that, rather than announcing a version
          # that does not exist and attaching nothing to it — a release that
          # goes quiet is indistinguishable from one nobody started.
          if ! ls out/* >/dev/null 2>&1; then
            MSG="$(printf '⚠️ Sozo %s — release YIQILDI, hech qanday fayl chiqmadi.\n\n🔎 %s' \
                   "${VERSION_NAME:-?}" "${RUN_URL}")"
            IFS=',' read -ra CHATS <<< "${TELEGRAM_CHAT_IDS}"
            for raw in "${CHATS[@]}"; do
              chat="$(echo "${raw}" | xargs)"
              [ -z "${chat}" ] && continue
              curl -sS -X POST "${API}/sendMessage" \
                --data-urlencode "chat_id=${chat}" \
                --data-urlencode "text=${MSG}" \
                --data "disable_web_page_preview=true" -o /dev/null || true
            done
            echo "::warning title=Nothing to deliver::The run produced no artifacts; a failure notice was sent instead."
            exit 0
          fi
          # The version job is the single source of this number, so the message
          # cannot disagree with what is actually inside the APKs.
          HEAD="$(printf '🎬 Sozo %s (build %s)\n\n🧰 Win/Linux/macOS fayllar shu run da (artifacts):\n%s' \
                  "${VERSION_NAME}" "${VERSION_BUILD}" "${RUN_URL}")"

          if [ -n "${RELEASE_NOTES}" ]; then
            HEAD="$(printf '%s\n\n📝 %s' "${HEAD}" "${RELEASE_NOTES}")"
          fi

          # macOS is ad-hoc signed (no Apple cert), so first open needs one step.
          HEAD="${HEAD}$(printf '\n\n🍎 macOS: agar "damaged/ochilmadi" chiqsa, Applications ga qo'"'"'ying va Terminal da: xattr -dr com.apple.quarantine /Applications/Sozo.app (yo'"'"'riqnoma DMG ichida).')"

          # Android TV is the SAME APK (the manifest carries LEANBACK_LAUNCHER),
          # so say it in plain terms — otherwise people hunt the run artifacts
          # for a separate "TV build" that was never produced.
          HEAD="${HEAD}$(printf '\n\n📺 Android TV: alohida build yo'"'"'q — bir xil APK. TV ga app-arm64-v8a-release.apk ni sideload qiling (eski/arzon boks bo'"'"'lsa armeabi-v7a).')"

          # Files too big for the bot are only listed (the run artifacts have them).
          BIG=""
          for f in out/*; do
            [ -f "${f}" ] || continue
            sz="$(stat -c%s "${f}")"
            if [ "${sz}" -gt "${MAX}" ]; then
              BIG="${BIG}\n• $(basename "${f}") ($((sz/1024/1024)) MB)"
            fi
          done
          if [ -n "${BIG}" ]; then
            HEAD="${HEAD}$(printf '\n\n⬇️ Telegram limiti (50MB) dan katta, run artifacts dan oling:%b' "${BIG}")"
          fi

          fail=0
          IFS=',' read -ra CHATS <<< "${TELEGRAM_CHAT_IDS}"
          for raw in "${CHATS[@]}"; do
            chat="$(echo "${raw}" | xargs)"
            [ -z "${chat}" ] && continue
            echo "──▶ ${chat}"

            curl -sS --fail-with-body -X POST "${API}/sendMessage" \
              --data-urlencode "chat_id=${chat}" \
              --data-urlencode "text=${HEAD}" \
              --data "disable_web_page_preview=true" -o /tmp/tg_msg.json \
              || { echo "::error::sendMessage ${chat}: $(cat /tmp/tg_msg.json)"; fail=1; }

            for f in out/*; do
              [ -f "${f}" ] || continue
              name="$(basename "${f}")"
              size="$(stat -c%s "${f}")"
              [ "${size}" -gt "${MAX}" ] && continue   # too big — already listed
              if curl -sS --fail-with-body -X POST "${API}/sendDocument" \
                   -F "chat_id=${chat}" -F "document=@${f}" -o /tmp/tg_doc.json; then
                echo "    ✓ ${name} ($((size/1024/1024)) MB)"
              else
                echo "::error::sendDocument ${chat}/${name}: $(cat /tmp/tg_doc.json)"
                fail=1
              fi
            done
          done
          exit "${fail}"
